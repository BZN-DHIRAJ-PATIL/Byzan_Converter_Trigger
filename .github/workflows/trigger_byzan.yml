
name: Trigger Byzan Converter

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_byzan_converter]

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Check Byzan Repository Access
        env:
          GH_TOKEN: ${{ secrets.BYZAN_DISPATCH_TOKEN }}
        run: |
          STATUS=$(curl -sS -o response.json -w "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Byzan-Systems/017TJ0027")

          echo "Repository API status: $STATUS"
          cat response.json
          test "$STATUS" = "200"
