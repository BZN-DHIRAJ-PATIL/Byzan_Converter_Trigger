name: Trigger Byzan Converter

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_byzan_converter]

permissions:
  contents: read

jobs:
  create-trigger-file:
    runs-on: ubuntu-latest

    steps:
      - name: Create trigger file in Byzan Systems
        env:
          GH_TOKEN: ${{ secrets.BYZAN_DISPATCH_TOKEN }}
        run: |
          gh api \
            --method PUT \
            repos/Byzan-Systems/017TJ0027/contents/TRIGGER/execute.txt \
            -f message="Trigger converter workflow" \
            -f content="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -f branch="main" \
            -f sha="$(gh api repos/Byzan-Systems/017TJ0027/contents/TRIGGER/execute.txt --jq .sha 2>/dev/null || true)"
