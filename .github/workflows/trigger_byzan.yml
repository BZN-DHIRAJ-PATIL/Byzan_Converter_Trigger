
name: Trigger Byzan Converter

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_byzan_converter]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Byzan-Systems Workflow
        env:
          GH_TOKEN: ${{ secrets.BYZAN_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body --request POST \
            --url "https://api.github.com/repos/Byzan-Systems/017TJ0027/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"event_type":"Test_automation"}'
